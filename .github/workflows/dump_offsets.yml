name: Dump Rust Offsets

on:
  schedule:
    # Every 6 hours. Rust patches Thursday.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_dump:
        description: 'Force a dump even if build ID is unchanged'
        type: boolean
        default: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Read targets.json
        id: targets
        run: |
          APP_ID=$(jq -r '.app_id' targets.json)
          DUMPER_VERSION=$(jq -r '.il2cpp_dumper_version' targets.json)
          OUTPUT_HEADER=$(jq -r '.output_header // "offsets.h"' targets.json)

          for v in APP_ID DUMPER_VERSION OUTPUT_HEADER; do
            if [ -z "${!v}" ] || [ "${!v}" = "null" ]; then
              echo "::error::$v missing from targets.json"
              exit 1
            fi
          done

          echo "app_id=$APP_ID"                 >> $GITHUB_OUTPUT
          echo "dumper_version=$DUMPER_VERSION" >> $GITHUB_OUTPUT
          echo "output_header=$OUTPUT_HEADER"   >> $GITHUB_OUTPUT

      - name: Free disk space
        run: |
          # Parallel deletes. Each backgrounded, then wait.
          sudo rm -rf /usr/share/dotnet            &
          sudo rm -rf /usr/local/lib/android      &
          sudo rm -rf /opt/ghc                     &
          sudo rm -rf /usr/local/share/boost      &
          sudo rm -rf /usr/share/swift            &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          wait

          # hostedtoolcache has per-tool subtrees. Only the big ones matter.
          sudo rm -rf /opt/hostedtoolcache/node* &
          sudo rm -rf /opt/hostedtoolcache/Java* &
          sudo rm -rf /opt/hostedtoolcache/Ruby* &
          sudo rm -rf /opt/hostedtoolcache/PyPy* &
          wait

          sudo docker image prune -af || true
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3-pip unzip curl

          # SteamCMD via Valve's official tarball. No apt, no i386, no license prompt.
          mkdir -p "$HOME/steamcmd"
          curl -sqL "https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz" \
            | tar zxvf - -C "$HOME/steamcmd"

          # Self-update once so subsequent runs use the real client.
          "$HOME/steamcmd/steamcmd.sh" +quit || true

          echo "$HOME/steamcmd" >> $GITHUB_PATH

          pip3 install -r scripts/requirements.txt

      - name: Check Steam manifest for update
        id: manifest
        run: |
          APP_ID="${{ steps.targets.outputs.app_id }}"
          CURRENT=$(curl -sf "https://api.steamcmd.net/v1/info/${APP_ID}" \
            | jq -r ".data.\"${APP_ID}\".depots.branches.public.buildid" 2>/dev/null || echo "")

          if [ -z "$CURRENT" ] || [ "$CURRENT" = "null" ]; then
            echo "::warning::steamcmd.net API failed; falling back to always-dump"
            CURRENT="unknown"
          fi

          CACHED=$(cat .last_buildid 2>/dev/null || echo "0")

          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "cached=$CACHED"   >> $GITHUB_OUTPUT

          if [ "$CURRENT" != "$CACHED" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Build changed: $CACHED -> $CURRENT"
          elif [ "${{ inputs.force_dump }}" = "true" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Forced dump (build unchanged)"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No update. Build ID: $CACHED"
          fi

      - name: Download Rust server via SteamCMD (anonymous)
        if: steps.manifest.outputs.changed == 'true'
        run: |
          APP_ID="${{ steps.targets.outputs.app_id }}"
          mkdir -p /tmp/rust_server

          # Anonymous login — no Steam account, no Guard, no secrets.
          # Server depot (258550) ships the same IL2CPP binaries as the client.
          "$HOME/steamcmd/steamcmd.sh" \
            +force_install_dir /tmp/rust_server \
            +login anonymous \
            +app_update "$APP_ID" validate \
            +quit

          echo "=== Locating target files ==="
          GAMEASSEMBLY=$(find /tmp/rust_server -name "GameAssembly.dll" -print -quit)
          METADATA=$(find /tmp/rust_server -name "global-metadata.dat" -print -quit)

          if [ -z "$GAMEASSEMBLY" ]; then
            echo "::error::GameAssembly.dll not found after download"
            exit 1
          fi
          if [ -z "$METADATA" ]; then
            echo "::error::global-metadata.dat not found after download"
            exit 1
          fi

          echo "GameAssembly: $GAMEASSEMBLY"
          echo "Metadata:     $METADATA"
          echo "GAMEASSEMBLY=$GAMEASSEMBLY" >> $GITHUB_ENV
          echo "METADATA=$METADATA"         >> $GITHUB_ENV

      - name: Download IL2CPP Dumper
        if: steps.manifest.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.targets.outputs.dumper_version }}"

          try_url() {
            local url="$1"
            echo "Trying: $url"
            if curl -sfL "$url" -o /tmp/il2cpp.zip; then
              if unzip -tq /tmp/il2cpp.zip > /dev/null 2>&1; then
                return 0
              fi
              echo "  downloaded but not a valid zip"
            fi
            return 1
          }

          if try_url "https://github.com/lxraa/Il2CppDumper/releases/download/v${VERSION}/Il2CppDumper-net8-linux-x64.zip"; then
            echo "Using lxraa fork v${VERSION}"
          elif try_url "https://github.com/Perfare/Il2CppDumper/releases/download/v${VERSION}/Il2CppDumper-net6-linux-x64.zip"; then
            echo "Using Perfare upstream v${VERSION}"
          else
            echo "::error::Could not download any IL2CPP Dumper release"
            exit 1
          fi

          mkdir -p /tmp/il2cpp
          unzip -q /tmp/il2cpp.zip -d /tmp/il2cpp

          # Asset layout differs between forks. Find the entrypoint.
          DUMPER_BIN=$(find /tmp/il2cpp -type f \( -name "Il2CppDumper" -o -name "Il2CppDumper.dll" \) | head -n1)
          if [ -z "$DUMPER_BIN" ]; then
            echo "::error::Dumper binary not found in extracted archive"
            find /tmp/il2cpp -maxdepth 3 -type f | head -50
            exit 1
          fi

          chmod +x "$DUMPER_BIN"
          echo "DUMPER_BIN=$DUMPER_BIN" >> $GITHUB_ENV
          echo "Dumper: $DUMPER_BIN"

      - name: Run IL2CPP Dumper
        if: steps.manifest.outputs.changed == 'true'
        run: |
          mkdir -p /tmp/output
          cd /tmp/output

          "$DUMPER_BIN" "$GAMEASSEMBLY" "$METADATA" /tmp/output || {
            echo "::error::IL2CPP Dumper failed"
            exit 1
          }

          echo "=== Dumper output ==="
          ls -la /tmp/output/
          echo "=== dump.cs head ==="
          head -80 /tmp/output/dump.cs
          echo "=== dump.cs line count ==="
          wc -l /tmp/output/dump.cs

      - name: Parse offsets
        if: steps.manifest.outputs.changed == 'true'
        run: |
          OUTPUT_HEADER="${{ steps.targets.outputs.output_header }}"
          python3 scripts/parse_offsets.py \
            /tmp/output/dump.cs \
            targets.json \
            "$OUTPUT_HEADER" || {
              echo "::error::Parser failed"
              exit 1
            }

      - name: Validate offsets
        if: steps.manifest.outputs.changed == 'true'
        id: validate
        run: |
          OUTPUT_HEADER="${{ steps.targets.outputs.output_header }}"
          python3 scripts/validate_offsets.py \
            /tmp/output/dump.cs \
            targets.json \
            "$OUTPUT_HEADER" > /tmp/validation_report.txt 2>&1 || true

          cat /tmp/validation_report.txt

          if grep -qiE "missing|not found|fail" /tmp/validation_report.txt; then
            echo "validation_failed=true" >> $GITHUB_OUTPUT
          else
            echo "validation_failed=false" >> $GITHUB_OUTPUT
          fi

      - name: Update cached build ID
        if: steps.manifest.outputs.changed == 'true'
        run: echo "${{ steps.manifest.outputs.current }}" > .last_buildid

      - name: Commit and push
        if: steps.manifest.outputs.changed == 'true'
        id: commit
        run: |
          OUTPUT_HEADER="${{ steps.targets.outputs.output_header }}"
          git config user.name  'offsets-bot'
          git config user.email 'offsets-bot@users.noreply.github.com'

          git add "$OUTPUT_HEADER" .last_buildid

          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "committed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update offsets (build ${{ steps.manifest.outputs.current }})"
            git push
            echo "committed=true" >> $GITHUB_OUTPUT
          fi

      - name: Notify on validation failure
        if: steps.manifest.outputs.changed == 'true' && steps.validate.outputs.validation_failed == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 scripts/notify.py \
            --title "Offset validation warning" \
            --message "Build ${{ steps.manifest.outputs.current }} dumped, but some offsets are missing. Check the validation report." \
            --report /tmp/validation_report.txt

      - name: Notify on success
        if: steps.manifest.outputs.changed == 'true' && steps.commit.outputs.committed == 'true' && steps.validate.outputs.validation_failed != 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 scripts/notify.py \
            --title "Offsets updated" \
            --message "Build ${{ steps.manifest.outputs.current }} dumped. All targets found."

      - name: Notify on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 scripts/notify.py \
            --title "Offset pipeline failed" \
            --message "Workflow failed at step: ${{ github.job }}. Check logs."
