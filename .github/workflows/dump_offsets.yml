name: Rust Offsets

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install -r scripts/requirements.txt 2>/dev/null || true

      - name: Fetch and generate offsets.h
        id: gen
        run: |
          python3 scripts/fetch_offsets.py offsets.h
          if [ ! -s offsets.h ]; then
            echo "::error::offsets.h empty after generation"
            exit 1
          fi
          echo "generated=true" >> $GITHUB_OUTPUT

      - name: Show generated header
        run: |
          echo "=== head of offsets.h ==="
          head -40 offsets.h
          echo "..."
          echo "=== line count ==="
          wc -l offsets.h

      - name: Commit if changed
        id: commit
        run: |
          git config user.name 'offsets-bot'
          git config user.email 'offsets-bot@users.noreply.github.com'
          git add offsets.h
          if git diff --staged --quiet; then
            echo "No changes to offsets.h"
            echo "committed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update offsets.h from rustoffsets.com"
            git push
            echo "committed=true" >> $GITHUB_OUTPUT
          fi

      - name: Notify on update
        if: steps.commit.outputs.committed == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 scripts/notify.py \
            --title "Offsets updated" \
            --message "Fresh offsets.h from rustoffsets.com" || true

      - name: Notify on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 scripts/notify.py \
            --title "Offset fetch failed" \
            --message "Workflow failed. Check logs." || true
