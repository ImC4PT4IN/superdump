name: Rust Offset Watch

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_check:
        description: 'Force a check even if the hash is unchanged'
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL &
          wait
          sudo docker image prune -af || true
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl
          mkdir -p "$HOME/steamcmd"
          curl -sqL "https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz" \
            | tar zxvf - -C "$HOME/steamcmd"
          "$HOME/steamcmd/steamcmd.sh" +quit || true

      - name: Resolve manifest
        id: manifest
        run: |
          APP_ID=252490
          DEPOT_ID=252495

          MANIFEST_ID=$(curl -sf "https://api.steamcmd.net/v1/info/${APP_ID}" \
            | jq -r ".data.\"${APP_ID}\".depots.\"${DEPOT_ID}\".manifests.public.gid" 2>/dev/null || echo "")
          echo "manifest_id=$MANIFEST_ID" >> $GITHUB_OUTPUT

          BUILD_ID=$(curl -sf "https://api.steamcmd.net/v1/info/${APP_ID}" \
            | jq -r ".data.\"${APP_ID}\".depots.branches.public.buildid" 2>/dev/null || echo "unknown")
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

          CACHED=$(cat .last_buildid 2>/dev/null || echo "0")

          if [ "$BUILD_ID" != "$CACHED" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          elif [ "${{ inputs.force_check }}" = "true" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

          echo "Current build: $BUILD_ID (cached: $CACHED)"

      - name: Download latest GameAssembly
        if: steps.manifest.outputs.changed == 'true'
        env:
          STEAM_USER: ${{ secrets.STEAM_USER }}
          STEAM_PASS: ${{ secrets.STEAM_PASS }}
        run: |
          if [ -z "$STEAM_USER" ] || [ -z "$STEAM_PASS" ]; then
            echo "::error::STEAM_USER / STEAM_PASS not configured"
            exit 1
          fi

          MANIFEST_ID="${{ steps.manifest.outputs.manifest_id }}"
          DEPOT_ARGS="252490 252495"
          [ -n "$MANIFEST_ID" ] && DEPOT_ARGS="252490 252495 $MANIFEST_ID"

          "$HOME/steamcmd/steamcmd.sh" \
            +@sSteamCmdForcePlatformType windows \
            +login "$STEAM_USER" "$STEAM_PASS" \
            +download_depot $DEPOT_ARGS \
            +quit

          DEPOT_DIR=$(find "$HOME" -type d -name "depot_252495" -print -quit 2>/dev/null || echo "")
          if [ -z "$DEPOT_DIR" ]; then
            echo "::error::depot not found"
            exit 1
          fi

          GA="$DEPOT_DIR/GameAssembly.dll"
          if [ ! -f "$GA" ]; then
            echo "::error::GameAssembly.dll not found"
            exit 1
          fi

          SHA=$(sha256sum "$GA" | awk '{print $1}')
          echo "gameassembly_sha=$SHA" >> $GITHUB_OUTPUT
          echo "GameAssembly SHA256: $SHA"

          PREV_SHA=$(cat .last_gameassembly_sha 2>/dev/null || echo "none")
          echo "Previous SHA: $PREV_SHA"

          if [ "$SHA" != "$PREV_SHA" ]; then
            echo "binary_changed=true" >> $GITHUB_OUTPUT
          else
            echo "binary_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Save new build ID and hash
        if: steps.manifest.outputs.changed == 'true'
        run: |
          echo "${{ steps.manifest.outputs.build_id }}" > .last_buildid
          echo "${{ steps.download.outputs.gameassembly_sha }}" > .last_gameassembly_sha || true

      - name: Commit state files
        if: steps.manifest.outputs.changed == 'true'
        run: |
          git config user.name 'offsets-watcher'
          git config user.email 'offsets-watcher@users.noreply.github.com'
          git add .last_buildid .last_gameassembly_sha 2>/dev/null || git add .last_buildid || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Rust build ${{ steps.manifest.outputs.build_id }}"
            git push
          fi

      - name: Notify on update
        if: steps.manifest.outputs.changed == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 scripts/notify.py \
            --title "Rust updated" \
            --message "Build ${{ steps.manifest.outputs.build_id }}. New GameAssembly SHA. Check if offsets.h needs updating." || true

      - name: Notify on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 scripts/notify.py \
            --title "Rust watch failed" \
            --message "Workflow failed. Check logs." || true
