name: Dump Rust Offsets

on:
  schedule:
    # Every 6 hours. Rust patches Thursday.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_dump:
        description: 'Force a dump even if build ID is unchanged'
        type: boolean
        default: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Read targets.json
        id: targets
        run: |
          APP_ID=$(jq -r '.app_id' targets.json)
          DEPOT_ID=$(jq -r '.depot_id' targets.json)
          DUMPER_VERSION=$(jq -r '.il2cpp_dumper_version' targets.json)
          OUTPUT_HEADER=$(jq -r '.output_header // "offsets.h"' targets.json)

          for v in APP_ID DEPOT_ID DUMPER_VERSION OUTPUT_HEADER; do
            if [ -z "${!v}" ] || [ "${!v}" = "null" ]; then
              echo "::error::$v missing from targets.json"
              exit 1
            fi
          done

          echo "app_id=$APP_ID"                 >> $GITHUB_OUTPUT
          echo "depot_id=$DEPOT_ID"             >> $GITHUB_OUTPUT
          echo "dumper_version=$DUMPER_VERSION" >> $GITHUB_OUTPUT
          echo "output_header=$OUTPUT_HEADER"   >> $GITHUB_OUTPUT

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet            &
          sudo rm -rf /usr/local/lib/android      &
          sudo rm -rf /opt/ghc                     &
          sudo rm -rf /usr/local/share/boost      &
          sudo rm -rf /usr/share/swift            &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          wait

          sudo rm -rf /opt/hostedtoolcache/node* &
          sudo rm -rf /opt/hostedtoolcache/Java* &
          sudo rm -rf /opt/hostedtoolcache/Ruby* &
          sudo rm -rf /opt/hostedtoolcache/PyPy* &
          wait

          sudo docker image prune -af || true
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3-pip unzip curl

          # SteamCMD via Valve's official tarball.
          mkdir -p "$HOME/steamcmd"
          curl -sqL "https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz" \
            | tar zxvf - -C "$HOME/steamcmd"

          "$HOME/steamcmd/steamcmd.sh" +quit || true
          echo "$HOME/steamcmd" >> $GITHUB_PATH

          pip3 install -r scripts/requirements.txt

      - name: Resolve manifest ID for depot
        id: manifest
        run: |
          APP_ID="${{ steps.targets.outputs.app_id }}"
          DEPOT_ID="${{ steps.targets.outputs.depot_id }}"

          MANIFEST_ID=$(curl -sf "https://api.steamcmd.net/v1/info/${APP_ID}" \
            | jq -r ".data.\"${APP_ID}\".depots.\"${DEPOT_ID}\".manifests.public.gid" 2>/dev/null || echo "")

          if [ -z "$MANIFEST_ID" ] || [ "$MANIFEST_ID" = "null" ]; then
            echo "::warning::Could not resolve manifest for depot ${DEPOT_ID}; relying on SteamCMD default"
            MANIFEST_ID=""
          else
            echo "Resolved manifest: $MANIFEST_ID"
          fi

          echo "manifest_id=$MANIFEST_ID" >> $GITHUB_OUTPUT

          BUILD_ID=$(curl -sf "https://api.steamcmd.net/v1/info/${APP_ID}" \
            | jq -r ".data.\"${APP_ID}\".depots.branches.public.buildid" 2>/dev/null || echo "unknown")
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

          CACHED=$(cat .last_buildid 2>/dev/null || echo "0")

          if [ "$BUILD_ID" != "$CACHED" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Build changed: $CACHED -> $BUILD_ID"
          elif [ "${{ inputs.force_dump }}" = "true" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Forced dump (build unchanged)"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No update. Build ID: $CACHED"
          fi

      - name: Download Rust client depot
        if: steps.manifest.outputs.changed == 'true'
        env:
          STEAM_USER: ${{ secrets.STEAM_USER }}
          STEAM_PASS: ${{ secrets.STEAM_PASS }}
        run: |
          APP_ID="${{ steps.targets.outputs.app_id }}"
          DEPOT_ID="${{ steps.targets.outputs.depot_id }}"
          MANIFEST_ID="${{ steps.manifest.outputs.manifest_id }}"

          if [ -z "$STEAM_USER" ] || [ -z "$STEAM_PASS" ]; then
            echo "::error::STEAM_USER / STEAM_PASS not configured"
            exit 1
          fi

          # Build the download_depot args. If MANIFEST_ID resolved, pass it
          # explicitly — this avoids the "Invalid default manifest" error.
          DEPOT_ARGS="$APP_ID $DEPOT_ID"
          if [ -n "$MANIFEST_ID" ]; then
            DEPOT_ARGS="$APP_ID $DEPOT_ID $MANIFEST_ID"
          fi

          "$HOME/steamcmd/steamcmd.sh" \
            +@sSteamCmdForcePlatformType windows \
            +login "$STEAM_USER" "$STEAM_PASS" \
            +download_depot $DEPOT_ARGS \
            +quit

          # SteamCMD's install root follows the binary location, not $HOME/Steam.
          # The depot lands under $HOME/steamcmd/linux32/steamapps/content/...
          # Search $HOME recursively — never hardcode the path.
          STEAM_DEPOT_DIR=$(find "$HOME" -type d -name "depot_${DEPOT_ID}" -print -quit 2>/dev/null || echo "")

          if [ -z "$STEAM_DEPOT_DIR" ] || [ ! -d "$STEAM_DEPOT_DIR" ]; then
            echo "::error::depot directory not found after download"
            echo "=== searching \$HOME for depot_${DEPOT_ID} ==="
            find "$HOME" -type d -name "depot_${DEPOT_ID}" 2>/dev/null || true
            echo "=== any steamapps/content trees ==="
            find "$HOME" -type d -name "content" -path "*steamapps*" 2>/dev/null || true
            echo "=== top-level \$HOME ==="
            ls -la "$HOME" | head -40
            exit 1
          fi

          echo "=== depot dir: $STEAM_DEPOT_DIR ==="
          ls -la "$STEAM_DEPOT_DIR" | head -40
          echo "=== depot size ==="
          du -sh "$STEAM_DEPOT_DIR" 2>/dev/null || true

          GAMEASSEMBLY=$(find "$STEAM_DEPOT_DIR" -iname "GameAssembly.dll" -print -quit)
          METADATA=$(find "$STEAM_DEPOT_DIR" -iname "global-metadata.dat" -print -quit)

          if [ -z "$GAMEASSEMBLY" ]; then
            echo "::error::GameAssembly.dll not found in depot"
            echo "=== Largest files in depot ==="
            find "$STEAM_DEPOT_DIR" -maxdepth 5 -type f -printf '%s\t%p\n' 2>/dev/null | sort -rn | head -30
            exit 1
          fi
          if [ -z "$METADATA" ]; then
            echo "::error::global-metadata.dat not found in depot"
            echo "=== All .dat files in depot ==="
            find "$STEAM_DEPOT_DIR" -maxdepth 6 -iname "*.dat" -print 2>/dev/null | head -20
            exit 1
          fi

          echo "GameAssembly: $GAMEASSEMBLY"
          echo "Metadata:     $METADATA"
          echo "GAMEASSEMBLY=$GAMEASSEMBLY" >> $GITHUB_ENV
          echo "METADATA=$METADATA"         >> $GITHUB_ENV

      - name: Download IL2CPP Dumper
        if: steps.manifest.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.targets.outputs.dumper_version }}"

          # MlgmXyysd standalone provides Linux x64 binaries.
          # Asset naming: Il2CppDumper-<version>-linux-x64.zip
          URL="https://github.com/MlgmXyysd/Il2CppDumper-Standalone/releases/download/v${VERSION}-standalone/Il2CppDumper-${VERSION}-linux-x64.zip"

          echo "Trying: $URL"
          if ! curl -sfL "$URL" -o /tmp/il2cpp.zip; then
            echo "::error::Could not download Il2CppDumper Standalone"
            echo "=== Listing available release assets to verify naming ==="
            curl -sf "https://api.github.com/repos/MlgmXyysd/Il2CppDumper-Standalone/releases/tags/v${VERSION}-standalone" \
              | jq -r '.assets[].name' 2>/dev/null || true
            exit 1
          fi

          if ! unzip -tq /tmp/il2cpp.zip > /dev/null 2>&1; then
            echo "::error::Downloaded file is not a valid zip"
            exit 1
          fi

          mkdir -p /tmp/il2cpp
          unzip -q /tmp/il2cpp.zip -d /tmp/il2cpp

          DUMPER_BIN=$(find /tmp/il2cpp -type f -name "Il2CppDumper" | head -n1)
          if [ -z "$DUMPER_BIN" ]; then
            echo "::error::Dumper binary not found in extracted archive"
            find /tmp/il2cpp -maxdepth 3 -type f | head -50
            exit 1
          fi

          chmod +x "$DUMPER_BIN"
          echo "DUMPER_BIN=$DUMPER_BIN" >> $GITHUB_ENV
          echo "Dumper: $DUMPER_BIN"

      - name: Run IL2CPP Dumper
        if: steps.manifest.outputs.changed == 'true'
        run: |
          mkdir -p /tmp/output
          cd /tmp/output

          "$DUMPER_BIN" "$GAMEASSEMBLY" "$METADATA" /tmp/output || {
            echo "::error::IL2CPP Dumper failed"
            exit 1
          }

          echo "=== Dumper output ==="
          ls -la /tmp/output/
          echo "=== dump.cs line count ==="
          wc -l /tmp/output/dump.cs || true

      - name: Parse offsets
        if: steps.manifest.outputs.changed == 'true'
        run: |
          OUTPUT_HEADER="${{ steps.targets.outputs.output_header }}"
          python3 scripts/parse_offsets.py \
            /tmp/output/dump.cs \
            targets.json \
            "$OUTPUT_HEADER" || {
              echo "::error::Parser failed"
              exit 1
            }

      - name: Validate offsets
        if: steps.manifest.outputs.changed == 'true'
        id: validate
        run: |
          OUTPUT_HEADER="${{ steps.targets.outputs.output_header }}"
          python3 scripts/validate_offsets.py \
            /tmp/output/dump.cs \
            targets.json \
            "$OUTPUT_HEADER" > /tmp/validation_report.txt 2>&1 || true

          cat /tmp/validation_report.txt

          if grep -qiE "missing|not found|fail" /tmp/validation_report.txt; then
            echo "validation_failed=true" >> $GITHUB_OUTPUT
          else
            echo "validation_failed=false" >> $GITHUB_OUTPUT
          fi

      - name: Update cached build ID
        if: steps.manifest.outputs.changed == 'true'
        run: echo "${{ steps.manifest.outputs.build_id }}" > .last_buildid

      - name: Commit and push
        if: steps.manifest.outputs.changed == 'true'
        id: commit
        run: |
          OUTPUT_HEADER="${{ steps.targets.outputs.output_header }}"
          git config user.name  'offsets-bot'
          git config user.email 'offsets-bot@users.noreply.github.com'

          git add "$OUTPUT_HEADER" .last_buildid

          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "committed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update offsets (build ${{ steps.manifest.outputs.build_id }})"
            git push
            echo "committed=true" >> $GITHUB_OUTPUT
          fi

      - name: Notify on validation failure
        if: steps.manifest.outputs.changed == 'true' && steps.validate.outputs.validation_failed == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 scripts/notify.py \
            --title "Offset validation warning" \
            --message "Build ${{ steps.manifest.outputs.build_id }} dumped, but some offsets are missing." \
            --report /tmp/validation_report.txt

      - name: Notify on success
        if: steps.manifest.outputs.changed == 'true' && steps.commit.outputs.committed == 'true' && steps.validate.outputs.validation_failed != 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 scripts/notify.py \
            --title "Offsets updated" \
            --message "Build ${{ steps.manifest.outputs.build_id }} dumped. All targets found."

      - name: Notify on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 scripts/notify.py \
            --title "Offset pipeline failed" \
            --message "Workflow failed at step: ${{ github.job }}. Check logs."
