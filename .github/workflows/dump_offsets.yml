name: Dump Rust Offsets

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_dump:
        description: 'Force a fetch even if the source hash is unchanged'
        type: boolean
        default: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Read targets.json
        id: targets
        run: |
          OUT=$(jq -r '.output_header // "offsets.h"' targets.json)
          URL=$(jq -r '.rust_data_url' targets.json)

          for v in OUT URL; do
            if [ -z "${!v}" ] || [ "${!v}" = "null" ]; then
              echo "::error::missing config in targets.json"
              exit 1
            fi
          done

          echo "output_header=$OUT"    >> $GITHUB_OUTPUT
          echo "rust_data_url=$URL"    >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3-pip
          pip3 install -r scripts/requirements.txt 2>/dev/null || true

      - name: Fetch rust.h
        id: fetch
        run: |
          URL="${{ steps.targets.outputs.rust_data_url }}"
          curl -sfL "$URL" -o /tmp/rust.h

          if [ ! -s /tmp/rust.h ]; then
            echo "::error::empty rust.h"
            exit 1
          fi

          SHA=$(sha256sum /tmp/rust.h | awk '{print $1}')
          echo "source_sha=$SHA" >> $GITHUB_OUTPUT

          CACHED=$(cat .last_source_sha 2>/dev/null || echo "0")

          if [ "$SHA" != "$CACHED" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          elif [ "${{ inputs.force_dump }}" = "true" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

          echo "=== rust.h line count ==="
          wc -l /tmp/rust.h

      - name: Parse offsets
        if: steps.fetch.outputs.changed == 'true'
        id: parse
        run: |
          python3 scripts/parse_rust_data.py \
            /tmp/rust.h \
            scripts/mapping.json \
            "${{ steps.targets.outputs.output_header }}" \
            > /tmp/parse_report.txt 2>&1 || true

          cat /tmp/parse_report.txt

          if grep -qE '^\[parse\] OK=[0-9]+ ' /tmp/parse_report.txt; then
            OK=$(grep -oP 'OK=\K[0-9]+' /tmp/parse_report.txt | head -1)
            if [ "${OK:-0}" = "0" ]; then
              echo "::error::no offsets resolved"
              exit 1
            fi
          fi

          if grep -q 'MISSING' /tmp/parse_report.txt || grep -q 'DRIFT' /tmp/parse_report.txt; then
            echo "drift=true" >> $GITHUB_OUTPUT
          else
            echo "drift=false" >> $GITHUB_OUTPUT
          fi

      - name: Show generated header
        if: steps.fetch.outputs.changed == 'true'
        run: |
          echo "=== offsets.h ==="
          cat "${{ steps.targets.outputs.output_header }}" || true

      - name: Update source hash
        if: steps.fetch.outputs.changed == 'true'
        run: echo "${{ steps.fetch.outputs.source_sha }}" > .last_source_sha

      - name: Commit and push
        if: steps.fetch.outputs.changed == 'true'
        id: commit
        run: |
          OUT="${{ steps.targets.outputs.output_header }}"
          git config user.name  'offsets-bot'
          git config user.email 'offsets-bot@users.noreply.github.com'
          git add "$OUT" .last_source_sha || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "committed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update offsets (source sha ${{ steps.fetch.outputs.source_sha }})"
            git push
            echo "committed=true" >> $GITHUB_OUTPUT
          fi

      - name: Notify on drift
        if: steps.fetch.outputs.changed == 'true' && steps.parse.outputs.drift == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 scripts/notify.py \
            --title "Offset drift detected" \
            --message "rust.h updated. Some fields moved or went missing. Check the parse report." \
            --report /tmp/parse_report.txt || true

      - name: Notify on success
        if: steps.fetch.outputs.changed == 'true' && steps.commit.outputs.committed == 'true' && steps.parse.outputs.drift != 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 scripts/notify.py \
            --title "Offsets updated" \
            --message "Fresh rust.h parsed. All mapped fields validated." || true

      - name: Notify on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 scripts/notify.py \
            --title "Offset pipeline failed" \
            --message "Workflow failed. Check logs." || true
